env_params:
  random_seed: 42

train_params:
  test_size: 0.1
  val_size: 0.1
  model_name: "gcn"
  clean: "drop"
  log_dir: "/dataslow/fbello/output/ute"
  interpolate_method: null
  shuffle: true
  batch_size: 128
  n_workers: 0
  init_lr: 0.001
  n_epochs: 2
  log_every_n_steps: 1
  ckpt_path_resume: null
  weight_decay: 0.00001
  eps: 0.00000001
  betas: [0.9, 0.999]
  down_len: 10

model_params:
  window_size: 10
  n_layers: 3
  hidden_dim: 64
  K: 3
  # edge_index_path: "datasets_files/swat/edge_index.pt"
  
predictor_params:
  ckpt_folder: "output/gcn/version_1"
  n_thresholds: 0
  window_size_smooth: 5
  post_process_scores: true
  score_type: "abs"
  dataset_for_threshold: "train"
  range_based: false
  range_metrics_alpha: 0.5
  
optimization_params:
  study_name: "gcn_optimization_ute"
  n_trials: 100
  metric: "vus_pr_mean"
