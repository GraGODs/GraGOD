model_params:
  window_size: 155
  embed_dim: 80
  out_layer_num: 7
  out_layer_inter_dim: 448
  topk: 3
  heads: 4
  learn_graph: true
  negative_slope: 0.2
  dropout: 0.1

train_params:
  model_name: "gdn"
  log_dir: "test_telco"
  n_epochs: 200
  batch_size: 512
  init_lr: 0.001
  target_dims: null
  n_workers: 0
  log_every_n_steps: 1
  shuffle: true
  clean: "drop"
  interpolate_method: null
  weight_decay: 0.00001
  eps: 0.00000001
  betas: [0.9, 0.999]
  horizon: 1
  down_len: 1  
  max_std: 7.0
  cutoff_value: 30.0
  labels_widening: true
  monitor: "Loss/val"
  monitor_mode: "min"
  early_stop_patience: 10
  early_stop_delta: 0.001

predictor_params:
  post_process_scores: true
  n_thresholds: 100
  window_size_smooth: 5 
  dataset_for_threshold: "train"
  range_based: true
  range_metrics_alpha: 0.5
  min_precision: 0.2
  score_type: "abs"
  # ckpt_folder: "benchmarks_telco/gdn/version_0"
  ckpt_folder: "test_telco/gdn/version_0"
